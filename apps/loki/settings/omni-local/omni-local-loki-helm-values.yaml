loki:
  commonConfig:
    replication_factor: 1
  storage_config:
    aws:
      region: bal
      bucketnames: omni-local-loki-chunk
      s3forcepathstyle: true
  storage:
    type: s3
    bucketNames:
      chunks: omni-local-loki-chunk
      ruler: omni-local-loki-ruler
      # admin: omni-local-loki-admin
    s3:
      endpoint: s3.bal.949x.net:9000
      region: bal
      secretAccessKey: ${S3_SECRET_KEY}
      accessKeyId: ${S3_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false

gateway:
  # omni-local is a single-node cluster: the chart default is a *required*
  # cross-host podAntiAffinity, so any RollingUpdate surges a second gateway
  # pod that can never schedule ("0/1 nodes are available: 1 node(s) didn't
  # match pod anti-affinity rules") and the rollout deadlocks permanently
  # (ProgressDeadlineExceeded, ArgoCD Degraded). Verified 2026-09-22.
  # Emptying the required term releases the constraint; replicas stays 1.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution: []
  service:
    type: LoadBalancer
    annotations:
      io.cilium/lb-ipam-ips: 10.96.210.102
    labels:
      cilium-lb-ip-pool: internal-lb-ip-pool
