toolbox:
  enabled: true
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 128Mi

monitoring:
  enabled: true
  createPrometheusRules: true

# Discard stays OFF (Ceph default). With async discard on, a clean OSD shutdown can write
# an allocator file that collides with BlueFS extents, and the OSD then never starts again
# ("Uexpected extent" in init_rm_free, https://tracker.ceph.com/issues/81213, unfixed).
# This killed osd.0 and osd.1 on 2026-10-13. This file beats the mon config DB, so keep it here.
configOverride: |
  [global]
  bdev_enable_discard = false
  bdev_async_discard = false
  bdev_async_discard_threads = 0
  [osd.0]
  bluestore_slow_ops_warn_lifetime = 60
  bluestore_slow_ops_warn_threshold = 10
  bdev_stalled_read_warn_lifetime = 60
  bdev_stalled_read_warn_threshold = 10
  [osd.1]
  bluestore_slow_ops_warn_lifetime = 60
  bluestore_slow_ops_warn_threshold = 10
  bdev_stalled_read_warn_lifetime = 60
  bdev_stalled_read_warn_threshold = 10

cephClusterSpec:
  crashCollector:
    disable: true
  dashboard:
    ssl: false
  storage:
    # Explicit node list + scheduleAlways (kept from #434 so a cordoned storage node stays
    # managed). Nodes inherit the cluster-level devices below (same resolution as useAllNodes).
    # Any node added to or removed from the cluster must be added to / removed from this list.
    useAllNodes: false
    scheduleAlways: true
    useAllDevices: false
    devices:
      - name: "sda5"
      - name: "nvme0n1p5"
    nodes:
      - name: "t3s-zendo-w1"
      # osd.1 on w2 was recovered on 2026-10-14 after the async-discard allocator bug
      # (tracker #81213, see configOverride). w2 stays cordoned; scheduleAlways plus the
      # unschedulable toleration below keep Rook managing osd.1 anyway.
      - name: "t3s-zendo-w2"
      - name: "t3s-zendo-w3"
      - name: "t3s-zendo-w4"
  # Rook only treats a node as valid if the OSD placement tolerates all its taints, and the
  # osd-prepare job does not inherit placement.osd (only placement.all + placement.prepareosd),
  # so both need the cordon taint tolerated. Kept off placement.all on purpose: mons/mgrs/mds
  # must not move onto a cordoned node.
  placement:
    osd:
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
    prepareosd:
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
  resources:
    mgr:
      limits:
        memory: "2Gi"
      requests:
        cpu: "30m"
        memory: "512Mi"
    mon:
      limits:
        memory: "2Gi"
      requests:
        cpu: "35m"
        memory: "512Mi"
    osd:
      limits:
        memory: "2560Mi"
      requests:
        cpu: "30m"
        memory: "2048Mi"
    prepareosd:
      requests:
        cpu: "200m"
    cleanup:
      requests:
        cpu: "200m"
        memory: "50Mi"
    logCollector:
      requests:
        cpu: "10m"
        memory: "100Mi"
      limits:
        memory: "100Mi"
    exporter:
      requests:
        cpu: "10m"
        memory: "100Mi"
      limits:
        memory: "250Mi"
  healthCheck:
    # Rook (cluster/version.go) refuses a Ceph image change while `ceph status` is HEALTH_ERR,
    # and it re-checks on every reconcile while daemon versions are mixed. Ceph >= 19.2.6 mons
    # raise these two HEALTH_ERR codes (CVE-2025-30156) until the daemon keys are rotated, so an
    # interrupted Ceph 19.2.6 upgrade could never resume. Muted checks do not count towards the
    # overall status. Rook mutes them with --sticky, which works before they are raised and
    # survives mon restarts. TEMPORARY: switch both to `policy: unmute` once the daemon key
    # rotation is done (rook-ceph upgrade 2026-10-13, step C).
    muteHealthWarning:
      AUTH_INSECURE_SERVICE_KEY_TYPE:
        policy: mute
      AUTH_INSECURE_SERVICE_TICKETS:
        policy: mute
  annotations:
    dashboard:
      omni-kube-service-exposer.sidero.dev/port: "51001"
      omni-kube-service-exposer.sidero.dev/label: "Ceph Dashboard"
      omni-kube-service-exposer.sidero.dev/icon: ""

cephBlockPools:
  - name: ceph-blockpool
    # see https://github.com/rook/rook/blob/v1.19.0-beta.0/Documentation/CRDs/Block-Storage/ceph-block-pool-crd.md#spec for available configuration
    spec:
      failureDomain: host
      replicated:
        size: 3
      # Enables collecting RBD per-image IO statistics by enabling dynamic OSD performance counters. Defaults to false.
      # For reference: https://docs.ceph.com/docs/latest/mgr/prometheus/#rbd-io-statistics
      # enableRBDStats: true
    storageClass:
      enabled: true
      name: ceph-block
      annotations: {}
      labels: {}
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: "Immediate"
      mountOptions: []
      # see https://kubernetes.io/docs/concepts/storage/storage-classes/#allowed-topologies
      allowedTopologies: []
      #        - matchLabelExpressions:
      #            - key: rook-ceph-role
      #              values:
      #                - storage-node
      # see https://github.com/rook/rook/blob/v1.19.0-beta.0/Documentation/Storage-Configuration/Block-Storage-RBD/block-storage.md#provision-storage for available configuration
      parameters:
        # (optional) mapOptions is a comma-separated list of map options.
        # For krbd options refer
        # https://docs.ceph.com/docs/latest/man/8/rbd/#kernel-rbd-krbd-options
        # For nbd options refer
        # https://docs.ceph.com/docs/latest/man/8/rbd-nbd/#options
        # mapOptions: lock_on_read,queue_depth=1024

        # (optional) unmapOptions is a comma-separated list of unmap options.
        # For krbd options refer
        # https://docs.ceph.com/docs/latest/man/8/rbd/#kernel-rbd-krbd-options
        # For nbd options refer
        # https://docs.ceph.com/docs/latest/man/8/rbd-nbd/#options
        # unmapOptions: force

        # RBD image format. Defaults to "2".
        imageFormat: "2"

        # RBD image features, equivalent to OR'd bitfield value: 63
        # Available for imageFormat: "2". Older releases of CSI RBD
        # support only the `layering` feature. The Linux kernel (KRBD) supports the
        # full feature complement as of 5.4
        imageFeatures: layering

        # These secrets contain Ceph admin credentials.
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
        # Specify the filesystem type of the volume. If not specified, csi-provisioner
        # will set default as `ext4`. Note that `xfs` is not recommended due to potential deadlock
        # in hyperconverged settings where the volume is mounted on the same node as the osds.
        csi.storage.k8s.io/fstype: ext4

cephFileSystems:
  - name: ceph-filesystem
    # see https://github.com/rook/rook/blob/master/Documentation/CRDs/Shared-Filesystem/ceph-filesystem-crd.md#filesystem-settings for available configuration
    spec:
      metadataPool:
        replicated:
          size: 3
      dataPools:
        - failureDomain: host
          replicated:
            size: 3
          # Optional and highly recommended, 'data0' by default, see https://github.com/rook/rook/blob/master/Documentation/CRDs/Shared-Filesystem/ceph-filesystem-crd.md#pools
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: true
        resources:
          limits:
            memory: "100Mi"
          requests:
            cpu: "20m"
            memory: "100Mi"
        priorityClassName: system-cluster-critical
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem
      # (Optional) specify a data pool to use, must be the name of one of the data pools above, 'data0' by default
      pool: data0
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: "Immediate"
      annotations: {}
      labels: {}
      mountOptions: []
      # see https://github.com/rook/rook/blob/master/Documentation/Storage-Configuration/Shared-Filesystem-CephFS/filesystem-storage.md#provision-storage for available configuration
      parameters:
        # The secrets contain Ceph admin credentials.
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-publish-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        # Specify the filesystem type of the volume. If not specified, csi-provisioner
        # will set default as `ext4`. Note that `xfs` is not recommended due to potential deadlock
        # in hyperconverged settings where the volume is mounted on the same node as the osds.
        csi.storage.k8s.io/fstype: ext4

cephObjectStores: []

cephFileSystemVolumeSnapshotClass:
  enabled: true
  isDefault: true
  labels:
    velero.io/csi-volumesnapshot-class: "true"

cephBlockPoolsVolumeSnapshotClass:
  enabled: true
  isDefault: true
  labels:
    velero.io/csi-volumesnapshot-class: "true"
