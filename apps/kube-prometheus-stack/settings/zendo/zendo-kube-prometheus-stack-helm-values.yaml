prometheus:
  prometheusSpec:
    replicas: 2
    # 48h, not 6h. The Rook/Ceph rules in rook-ceph/prometheus-ceph-rules predict
    # host filesystem fill over a 2d window:
    #   predict_linear(node_filesystem_free_bytes{device=~"/.*"}[2d], 3600*24*5) < 0
    # Against 6h of local data that window is a 6h regression, so a single write
    # burst produced CephNodeDiskspaceWarning on t3s-zendo-w4 (/var) and cleared
    # itself again — a recurring false positive. With a real 48h window the same
    # query returns +7.8 GB (Thanos, 2026-09-11), i.e. no fire. Thanos still owns
    # long-term; 2d fits under the 3GiB cap (≈1.2 GB/day) on the 5Gi PVC.
    retention: 48h
    retentionSize: "3GiB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          resources:
            requests:
              storage: 5Gi
    thanos:
      objectStorageConfig:
        existingSecret:
          name: thanos-s3-keys
          key: thanos-object-storage-config.yaml
      additionalArgs:
        - name: shipper.upload-compacted
  thanosService:
    enabled: true
  thanosServiceMonitor:
    enabled: true

alertmanager:
  templateFiles:
    telegram.tmpl: |-
      {{- define "telegram.message" -}}
      {{- $maxAlerts := 3 -}}
      {{- $totalAlerts := len .Alerts -}}
      {{- if eq .Status "firing" -}}🔥 {{- end -}}{{- if eq .Status "resolved" -}}✅ {{- end -}}<b>[{{ .Status | toUpper }}] [zendo] {{ .CommonLabels.alertname }}{{ if .CommonLabels.instance }} on {{ .CommonLabels.instance }}{{ end }}</b>
      {{ "\n" }}
      {{- if gt $totalAlerts $maxAlerts }}
      <i>Showing first {{ $maxAlerts }} of {{ $totalAlerts }} alerts to stay within Telegram message size limits.</i>
      {{ "\n" }}
      {{- end }}
      {{- if gt $totalAlerts $maxAlerts -}}
      {{- range $i, $alert := (slice .Alerts 0 $maxAlerts) -}}
      {{- if gt $i 0 }}{{ "\n\n" }}{{- end -}}
      {{- template "telegram.alert" $alert -}}
      {{- end -}}
      {{- else -}}
      {{- range $i, $alert := .Alerts -}}
      {{- if gt $i 0 }}{{ "\n\n" }}{{- end -}}
      {{- template "telegram.alert" $alert -}}
      {{- end -}}
      {{- end }}
      {{ "\n\n" }}
      <a href="https://grafana.apps.949x.net/alerting/list?view=state">Go to Grafana</a>
      {{- end -}}
      {{- define "telegram.alert" -}}
      {{$severity := .Labels.severity -}}
      {{- if eq $severity "warning" }}
      <b>Severity: </b> WARNING ⚠️
      {{- else if eq $severity "critical" }}
      <b>Severity: </b> CRITICAL 🚨
      {{- else }}
      <b>Severity: </b> {{$severity | toUpper }} 😱
      {{- end }}
      {{- $status := .Status -}}
      {{- if eq $status "firing" }}
      <b>Date/Time: </b> {{ .StartsAt.Format "Mon 02 Jan 15:04:05 MST 2006" }}
      {{- else if eq $status "resolved" }}
      <b>Date/Time: </b> {{ .EndsAt.Format "Mon 02 Jan 15:04:05 MST 2006" }}
      {{- end }}
      <b>Alert: </b> {{ .Labels.alertname }}
      <b>Description: </b> {{ printf "%.240s" .Annotations.description }}

      <b>Details: </b>
      {{- if .Labels.instance }}
        - <i>Instance</i>: <code>{{ .Labels.instance }}</code>
      {{- end }}
      {{- if .Labels.job }}
        - <i>Job</i>: <code>{{ .Labels.job }}</code>
      {{- end }}
      {{- if .Labels.namespace }}
        - <i>Namespace</i>: <code>{{ .Labels.namespace }}</code>
      {{- end }}
      {{- if .Annotations.runbook_url }}

      Runbook: {{ .Annotations.runbook_url }}
      {{- end }}
      {{- end -}}

  alertmanagerSpec:
    externalUrl: "https://grafana.apps.949x.net/alerting/list?view=state"
