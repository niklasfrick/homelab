global:
  security:
    allowInsecureImages: true

image:
  registry: quay.io
  repository: thanos/thanos
  tag: v0.42.4 # renovate:docker depName=thanos registryUrl=quay.io/thanos

existingObjstoreSecret: thanos-s3-keys

query:
  enabled: true
  dnsDiscovery:
    sidecarsService: kube-prometheus-stack-thanos-discovery
    sidecarsNamespace: kube-prometheus-stack
  extraFlags:
    - --query.replica-label=prometheus_replica
    - --query.replica-label=rule_replica
  resources:
    requests:
      cpu: 10m
      memory: 200Mi
    limits:
      memory: 300Mi

queryFrontend:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 120Mi

bucketweb:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

compactor:
  enabled: true
  persistence:
    size: 20Gi
  # Retention is the only lever that bounds the compactor's LOCAL working set,
  # and the PVC stays at 20Gi. Measured 2026-09-15: one Prometheus replica
  # writes ~2.4 GB per 2d raw block (~1.2 GB/day), and a compaction group is
  # per-replica (prometheus_replica is an external label), so one group needs
  # sources + a matching compaction output + its 5m/1h downsampled copies:
  #   raw 30d -> the 14d-range group held 7 blocks = 17.2 GB of sources on a
  #   19.6 GB volume, so it could never fit -> ENOSPC halt 2026-09-14T18:28Z.
  # raw 4d -> ~5 GB sources, ~10 GB peak, ~half the volume left as headroom.
  # Do NOT raise retentionResolutionRaw past 5d without raising
  # persistence.size in the same commit.
  retentionResolutionRaw: 4d
  retentionResolution5m: 30d
  retentionResolution1h: 10y
  resources:
    requests:
      cpu: 10m
      memory: 350Mi
    limits:
      memory: 700Mi

storegateway:
  enabled: true
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      memory: 1200Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
